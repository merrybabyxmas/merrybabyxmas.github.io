show_aboutme_card: true
about_me_title: About Me
about_me_description: >
  I am a graduate student at Sogang University's Machine Learning Lab, working on computer vision,
  generative AI, and multimodal AI. My current research focuses on video generation and evaluation,
  especially whether multi-shot generated videos preserve narrative state transitions across multiple
  entities. I am also interested in LLM reasoning, retrieval-augmented forecasting, financial-market
  prediction, and AI systems for mental-health and suicide-risk forecasting.
  <br><br>
  Recent work includes <b>The Algebra of Storytelling</b>, accepted to ACM Multimedia 2026, and
  <b>Retrieve the Right Signal</b>, accepted to CIKM 2026. I received my B.A. in Management Science
  from Sogang University and am pursuing an M.S. in Machine Learning.

