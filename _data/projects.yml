- name: "The Algebra of Storytelling"
  descr: "ACM Multimedia 2026. A state-transition benchmark for spanning multi-entity, multi-shot narratives. The project introduces MEMS-1K and STEM to evaluate whether entities enter, exit, and remain present correctly across generated video shots."
  demo: https://github.com/merrybabyxmas/The-Algebra-of-Storytelling
  tags:
    - tag: ACM MM 2026
    - tag: Video Generation
    - tag: Benchmark
    - tag: Evaluation

- name: "Retrieve the Right Signal"
  descr: "CIKM 2026. A decomposition-guided retrieval-augmented forecasting framework for financial markets, designed to retrieve component-specific historical signals for financial time-series prediction."
  tags:
    - tag: CIKM 2026
    - tag: Forecasting
